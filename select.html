<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pick Your Character</title>
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js"}}</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f0f1e;
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 24px;
  }
  h1 {
    text-align: center;
    font-size: 2.4em;
    color: #f8d210;
    text-shadow: 0 0 20px #f8d21066;
    margin-bottom: 6px;
  }
  .subtitle {
    text-align: center;
    color: #888;
    margin-bottom: 24px;
    font-size: 1.05em;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 14px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .card {
    background: #1a1a3a;
    border-radius: 12px;
    overflow: hidden;
    border: 3px solid #2a2a5a;
    cursor: pointer;
    transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
    position: relative;
    color: inherit;
    font: inherit;
    text-align: center;
    width: 100%;
  }
  .card:hover {
    transform: scale(1.06);
    border-color: #f8d210;
    box-shadow: 0 0 16px #f8d21044;
  }
  .card.selected {
    border-color: #00ff88;
    box-shadow: 0 0 20px #00ff8866;
  }
  .card:focus-visible, #play-btn:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 4px;
  }
  .card.selected::after {
    content: '✓';
    position: absolute;
    top: 6px; right: 8px;
    background: #00ff88;
    color: #0f0f1e;
    font-weight: bold;
    border-radius: 50%;
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }
  .model-slot {
    width: 100%;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #a7bdc6;
  }
  .model-gallery-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
  .card .num {
    display: block;
    background: #f8d210;
    color: #0f0f1e;
    font-weight: bold;
    font-size: 1em;
    text-align: center;
    padding: 5px;
  }
  .card .name {
    display: block;
    background: #16213e;
    color: #ccc;
    font-size: 0.78em;
    text-align: center;
    padding: 4px 4px 6px;
    line-height: 1.2;
  }
  #sel-info {
    text-align: center;
    margin: 18px 0 6px;
    font-size: 1.15em;
    color: #00ff88;
    min-height: 28px;
  }
  #play-btn {
    display: none;
    margin: 16px auto;
    padding: 14px 48px;
    font-size: 1.2em;
    background: #f8d210;
    color: #0f0f1e;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 20px #f8d21055;
  }
  #play-btn:hover {
    transform: scale(1.06);
    box-shadow: 0 6px 28px #f8d21088;
  }
  .legend {
    max-width: 1100px;
    margin: 24px auto 0;
    background: #16213e;
    border-radius: 12px;
    padding: 16px 20px;
    border: 1px solid #2a2a5a;
    color: #888;
    font-size: 0.82em;
    line-height: 1.7;
  }
  .legend strong { color: #f8d210; }
  @media (max-width: 960px) {
    .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    body { padding: 16px; }
    h1 { font-size: 2em; }
  }
  @media (max-width: 440px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, #play-btn { transition: none; }
    .card:hover, #play-btn:hover { transform: none; }
  }
</style>
</head>
<body data-gallery="characters">
<h1>🎮 Choose Your Hero</h1>
<p class="subtitle">Choose your character, then press Play. Use Tab and Enter on a keyboard.</p>
<div class="grid" id="grid" role="group" aria-label="Choose your character"></div>
<p id="sel-info" role="status" aria-live="polite">⏳ Choose a character to select it</p>
<button id="play-btn" type="button" onclick="startGame()">▶ Play!</button>
<div class="legend"><strong>3D library characters</strong><br>These are live models from your existing library, with clear backgrounds. <a href="assets.html" style="color:#f8d210">Inspect all selected objects</a>.</div>

<script>
var CHARACTERS = [
  { id: 1,  name: "Boy Cap",       file: "char_01.webp" },
  { id: 2,  name: "Blue Hoodie",  file: "char_02.webp" },
  { id: 3,  name: "Cat",          file: "char_03.webp" },
  { id: 4,  name: "Robot",        file: "char_04.webp" },
  { id: 5,  name: "Dog",          file: "char_05.webp" },
  { id: 6,  name: "Ninja",        file: "char_06.webp" },
  { id: 7,  name: "Bunny",        file: "char_07.webp" },
  { id: 8,  name: "Wizard",       file: "char_08.webp" },
  { id: 9,  name: "Alien",        file: "char_09.webp" },
  { id: 10, name: "Pirate",       file: "char_10.webp" },
  { id: 11, name: "Penguin",      file: "char_11.webp" },
  { id: 12, name: "Knight",       file: "char_12.webp" },
  { id: 13, name: "Fox",          file: "char_13.webp" },
  { id: 14, name: "Astronaut",    file: "char_14.webp" },
  { id: 15, name: "Pig",          file: "char_15.webp" },
  { id: 16, name: "Superhero",    file: "char_16.webp" },
  { id: 17, name: "Bear",         file: "char_17.webp" },
  { id: 18, name: "Chef",         file: "char_18.webp" },
  { id: 19, name: "Skeleton",     file: "char_19.webp" },
  { id: 20, name: "Koala",        file: "char_20.webp" },
  { id: 21, name: "Builder",      file: "char_21.webp" },
  { id: 22, name: "Frog",          file: "char_22.webp" },
  { id: 23, name: "Firefighter",   file: "char_23.webp" },
  { id: 24, name: "Unicorn",      file: "char_24.webp" },
];

var selected = null;

var grid = document.getElementById('grid');
CHARACTERS.forEach(function(ch) {
  var card = document.createElement('button');
  card.type = 'button';
  card.className = 'card';
  card.dataset.id = ch.id;
  card.setAttribute('aria-label', '#' + ch.id + ' ' + ch.name);
  card.setAttribute('aria-pressed', 'false');
  card.innerHTML =
    '<span class="model-slot">Loading 3D model…</span>' +
    '<span class="num">#' + ('0' + ch.id).slice(-2) + '</span>' +
    '<span class="name">' + ch.name + '</span>';
  card.onclick = function() { select(ch.id); };
  grid.appendChild(card);
});

function select(id) {
  if (id < 1 || id > CHARACTERS.length || id !== Math.floor(id)) return;
  selected = id;
  // The URL carries the choice into the game even if browser storage is blocked.
  try { localStorage.setItem('chosenCharacter', String(id)); } catch (e) {}
  document.querySelectorAll('.card').forEach(function(c) {
    var isSelected = parseInt(c.dataset.id, 10) === id;
    c.classList.toggle('selected', isSelected);
    c.setAttribute('aria-pressed', String(isSelected));
  });
  var ch = CHARACTERS[id - 1];
  document.getElementById('sel-info').textContent = '✅ Selected: #' + id + ' — ' + ch.name;
  var btn = document.getElementById('play-btn');
  btn.style.display = 'block';
  btn.textContent = '▶ Play as ' + ch.name + '!';
}

function startGame() {
  if (selected === null) return;
  window.location.href = 'index.html?char=' + selected;
}
</script>
<script type="module" src="src/render/model-gallery.js"></script>
</body>
</html>
