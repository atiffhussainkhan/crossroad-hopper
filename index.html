<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hopper — stage campaign</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<link rel="stylesheet" href="src/style.css">
<script type="importmap">
{"imports":{"three":"./vendor/three/build/three.module.js"}}
</script>
<script>window.World3D = { ready: false, status: "loading" };</script>
<script>
  // Auto-redirect to select screen if no character chosen yet
  (function() {
    var chosen = null;
    try { chosen = localStorage.getItem("chosenCharacter"); } catch(e) {}
    var params = new URLSearchParams(window.location.search);
    if (!chosen && !params.get("char")) {
      window.location.href = "select.html";
    }
  })();
</script>
</head>
<body>
<main id="app">
  <header id="topbar">
    <span id="stage-name">1. Suburb</span>
    <button id="char-btn" type="button" onclick="window.location.href='select.html'">Change Character</button>
    <button id="mode" type="button">1 player</button>
  </header>

  <div id="stage-wrap">
    <canvas id="board" width="300" height="420" tabindex="0"
            aria-label="Game board. Hop forward to reach the white line."></canvas>
    <canvas id="board-3d" aria-hidden="true"></canvas>
    <div id="banner" role="status" aria-live="polite"></div>
  </div>

  <footer id="hud">
    <div class="stat"><span class="k">Time</span><span class="v" id="timer">90.0</span></div>
    <div class="stat"><span class="k">Diff</span><span class="v" id="difficulty">0</span></div>
    <div class="stat"><span class="k">Lives</span><span class="v" id="lives">4</span></div>
    <div class="stat"><span class="k">Goal</span><span class="v" id="progress">0/40</span></div>
    <div class="stat"><span class="k">Score</span><span class="v" id="score">0</span></div>
  </footer>

  <div id="controls" role="group" aria-label="Movement controls">
    <button id="move-left" type="button" aria-label="Hop left">←</button>
    <button id="move-forward" type="button">↑ Hop</button>
    <button id="move-right" type="button" aria-label="Hop right">→</button>
    <button id="move-back" type="button" aria-label="Hop backward">↓ Back</button>
  </div>
  <p id="hint">Tap the board or press SPACE to hop. Swipe, use the buttons, or press arrow keys / WASD to move. Reach the white line before time runs out.</p>
  <a class="asset-link" href="assets.html">View the selected 3D assets</a>
</main>

<!-- Data first: the core reads stage constants at definition time. -->
<script src="src/stages.js"></script>
<!-- Pure-JS simulation: rng, player, pursuer, game state machine. -->
<script src="src/tiles.js"></script>
<script src="src/hazards.js"></script>
<script src="src/sim-core.js"></script>
<!-- Isometric renderer: the same conventions the Python preview uses. -->
<script src="src/render/iso.js"></script>
<!-- Object vocabulary, one real object per declared scenery name. -->
<script src="src/scenery.js"></script>
<script src="src/render/scene.js"></script>
<!-- DOM only: rendering, input, loop. -->
<script src="src/roster.js"></script>
<!-- Raster animation sheets. Optional: without them the roster draws in code. -->
<script src="src/render/sprite.js"></script>
<!-- The death beat: the boom and the soul. -->
<script src="src/render/deathfx.js"></script>
<script src="src/render/character.js"></script>
<script src="src/main.js"></script>
<script type="module" src="src/render/world3d.js"></script>
</body>
</html>
